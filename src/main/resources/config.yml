# Частота шага физики в секунду по умолчанию для новых миров (60 = идеальный баланс плавности и нагрузки)
tick_rate: 60

# Количество рабочих потоков Jolt (0 = автоопределение половины ядер процессора)
worker_threads: 0

# Память временного аллокатора Jolt в мегабайтах
temp_allocator_megabytes: 16

# Максимальное количество тел в одном мире симуляции
max_bodies: 65536
max_body_pairs: 65536
max_contact_constraints: 20480

# Максимальное количество шагов догона, если сервер лагает
max_catchup_steps: 4

# Итерации коллизий за шаг (1 вполне достаточно для стабильных твердых тел)
collision_steps: 1

# Лимит очереди событий столкновений (защита от переполнения памяти)
contact_event_queue_limit: 4096

# Высота, ниже которой нестатические тела считаются улетевшими в бездну
fall_out_y: -128.0

# Минимальная скорость удара (м/с) для вызова события столкновения в скриптах
contact_min_speed: 0.5

# Вариант нативных библиотек: auto, baseline или optimized (AVX2/FMA)
native_variant: auto

# Автосохранение физических тел, привязанных к дисплеям (хранится в самой сущности, чанки не раздувает)
persistence:
  # Включить сохранение и восстановление тел после рестарта и перезагрузки чанков
  enabled: true
  # Создавать физмир автоматически, если сущность помнит мир, которого ещё нет
  auto_create_world: true
  # Убирать тело из симуляции, когда выгружаются все его дисплеи (оно вернётся при загрузке чанка)
  unload_bodies: true
  # Как часто (сек) обновлять сохранённые данные тел в сущностях (0 = только при выгрузке и выключении)
  refresh_seconds: 30