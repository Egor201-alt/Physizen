name: Build Physizen

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: ver
        shell: bash
        run: |
          BASE=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          git fetch --tags --force
          LAST=$(git tag -l "v${BASE}-b*" | sed "s/^v${BASE}-b//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$LAST" ]; then
            NEXT=1
            PREV_TAG=$(git tag -l 'v*-b*' --sort=-creatordate | head -1 || true)
          else
            NEXT=$((LAST + 1))
            PREV_TAG="v${BASE}-b${LAST}"
          fi
          DEFAULT_REF="refs/heads/${{ github.event.repository.default_branch }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "$DEFAULT_REF" ]; then
            RELEASE=true
            BUILD_ID="$NEXT"
          else
            RELEASE=false
            BUILD_ID="${NEXT}-dev.${{ github.run_number }}"
          fi
          VERSION="${BASE}-b${BUILD_ID}"
          PRERELEASE=false
          case "$BASE" in 0.*) PRERELEASE=true ;; esac
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### Physizen ${VERSION}"
            echo ""
            echo "- Previous build: ${PREV_TAG:-none}"
            echo "- Release build: ${RELEASE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build with Gradle ShadowJar
        run: gradle :physizen-plugin:shadowJar --no-daemon -PbuildNumber=${{ steps.ver.outputs.build_id }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physizen-${{ steps.ver.outputs.version }}
          path: physizen-plugin/build/libs/Physizen-${{ steps.ver.outputs.version }}.jar

      - name: Publish Release
        if: steps.ver.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          ARGS=(--target "$GITHUB_SHA" --title "Physizen ${{ steps.ver.outputs.version }}" --generate-notes)
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          if [ -n "${{ steps.ver.outputs.prev_tag }}" ]; then
            ARGS+=(--notes-start-tag "${{ steps.ver.outputs.prev_tag }}")
          fi
          gh release create "$TAG" "physizen-plugin/build/libs/Physizen-${{ steps.ver.outputs.version }}.jar" "${ARGS[@]}"